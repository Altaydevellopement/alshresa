# Remplacez par l'identifiant du NOUVEAU projet Supabase
# (Project Settings > General > Reference ID)
project_id = "VOTRE_NOUVEAU_PROJECT_ID"

[auth]
# À adapter avec votre domaine Vercel (et à reporter dans
# Supabase > Authentication > URL Configuration)
site_url = "https://VOTRE-PROJET.vercel.app"
additional_redirect_urls = ["https://VOTRE-PROJET.vercel.app/**", "http://localhost:8080/**", "http://localhost:5173/**"]

[auth.email]
# Pas d'email de confirmation à l'inscription : seuls les emails présents dans
# authorized_emails peuvent créer un compte. (Supabase > Authentication >
# Sign In / Providers > Email > « Confirm email » désactivé.)
enable_confirmations = false

# Les fonctions exigent désormais un jeton valide (utilisateur connecté,
# ou clé du projet pour la tâche planifiée).
[functions.send-reservation-email]
verify_jwt = true

# Appelée par la tâche planifiée (Cron) ; elle ne fait que traiter la file
# des emails en attente, sans paramètre ni donnée renvoyée sensible.
[functions.send-notifications]
verify_jwt = false
